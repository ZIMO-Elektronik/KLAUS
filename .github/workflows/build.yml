  osx: 
    strategy: 
      matrix: 
        include: 
          - os: macos-15
            label: MacOS arm64
    
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 4.4.4
      - name: Install prerequisites
        run: |
          brew install gcc findutils
      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg; ./bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$PWD" >> $GITHUB_ENV
      - name: Build project
        run: cmake --workflow --preset build-and-pack-osx
        env: 
          CC: gcc
          CXX: g++
      - name: Find Bundle
        run: |
          echo "BUNDLE_NAME=$(gfind build -type f -name "z-klaus-*.dmg" -printf "%f" -quit)" >> $GITHUB_ENV
          echo "BUNDLE_PATH=$(gfind build -type f -name "z-klaus-*.dmg" -print -quit)" >> $GITHUB_ENV
      - name: Upload Bundle    
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: ${{ env.BUNDLE_PATH }}

