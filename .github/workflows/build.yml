name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  release_amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 4.4.4
      - name: Install prerequisites
        run: |
          sudo apt update -y
          sudo apt install -y libfontconfig1-dev ninja-build patchelf pkg-config
      - run: cmake --workflow --preset build-and-pack-linux
      - name: Find AppImage
        run: |
          echo "APPIMAGE_NAME=$(find build -type f -name "z-klaus-*-Linux.AppImage" -printf "%f" -quit)" >> $GITHUB_ENV
          echo "APPIMAGE_PATH=$(find build -type f -name "z-klaus-*-Linux.AppImage" -print -quit)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: ${{ env.APPIMAGE_PATH }}
